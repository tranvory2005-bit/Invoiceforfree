        <h2>Essential Elements of a Legally Compliant Invoice</h2>
        <ul>
          <li><strong>Header & Business Identification:</strong> Official business name, registered address, phone number, email, and tax identification number (EIN, VAT, ABN).</li>
          <li><strong>Unique Invoice Number & Dates:</strong> Sequential tracking number, issue date, and strict payment due date.</li>
          <li><strong>Client Information:</strong> Client contact person, company name, billing address, and tax ID if applicable.</li>
          <li><strong>Itemized Deliverables:</strong> Detailed breakdown of services rendered or goods sold, quantities, rates, and subtotals.</li>
          <li><strong>Taxes & Discounts:</strong> Explicit calculation of local sales tax, VAT, GST, or applied customer discounts.</li>
          <li><strong>Payment Instructions:</strong> Bank wire details, IBAN/SWIFT numbers, or payment links with clear payment terms (Net 30, Due upon receipt).</li>
        </ul>

        <h2>International Tax & Compliance Guidelines</h2>
        <p>
          Invoicing laws differ worldwide: In the United States, independent contractors provide Form W-9 and receive 1099-NEC. In the European Union, the VAT Directive mandates seller and buyer VAT numbers and reverse charge notifications on cross-border B2B trade. In the UK, HMRC requires specific VAT itemization in GBP. In Canada and Australia, GST/HST and ABN registrations must be displayed on tax invoices.
        </p>
